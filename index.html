    <script>
      (function() {
        // Fix for environments where window.fetch has only a getter
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e1) {
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'fetch', {
                get: function() { return _fetch; },
                set: function(val) { _fetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Suppress uncaught error if an external script/extension attempted to write to a getter-only fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('only a getter') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg) {
          if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('only a getter') !== -1) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
        };
      })();
    </script>
